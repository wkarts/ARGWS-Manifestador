[package]
name = "manifestador-nfe-legacy-migration-harness"
version = "1.5.0"
edition = "2021"
publish = false

[dependencies]
chrono = "0.4"
dirs = "5"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

base64 = "0.22"
flate2 = "1.1"
quick-xml = "0.41"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
argon2 = "0.5"
hostname = "0.4"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"

[features]
mobile = []
